# Maki + Z.AI pay-as-you-go provider profile for OpenShell.
#
# Lint and import from the repository root:
#   openshell profile lint -f examples/providers/maki-zai.yaml
#   openshell profile import -f examples/providers/maki-zai.yaml --global
#
# Then create the provider instance from your host environment:
#   ZHIPU_API_KEY=<key> openshell provider create \
#     --name maki-zai --type maki-zai --from-existing
#
# The profile authorizes only /usr/local/bin/maki (the path used by
# examples/maki-image) to reach api.z.ai, and binds ZHIPU_API_KEY to that
# endpoint. It targets the standard (pay-as-you-go) API path; for a coding
# plan key use maki-zai-coding.yaml instead. Do not set ZAI_BASE_URL in the
# sandbox: a different base URL would leave the credential unbound.

id: maki-zai
display_name: Maki (Z.AI)
description: Z.AI pay-as-you-go inference API for the Maki coding agent
category: inference
inference_capable: true

credentials:
  - name: api_key
    description: Z.AI (Zhipu) API key
    env_vars: [ZHIPU_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization

discovery:
  credentials: [api_key]

endpoints:
  - host: api.z.ai
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce

binaries:
  - /usr/local/bin/maki
