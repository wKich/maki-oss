# Maki + xAI provider profile for OpenShell.
#
# Lint and import from the repository root:
#   openshell profile lint -f examples/providers/maki-xai.yaml
#   openshell profile import -f examples/providers/maki-xai.yaml --global
#
# Then create the provider instance from your host environment:
#   XAI_API_KEY=<key> openshell provider create \
#     --name maki-xai --type maki-xai --from-existing
#
# This profile covers the public xAI API key endpoint. Maki's OAuth login
# (maki auth login xai) talks to the Grok CLI proxy with rotating tokens and
# is not covered here; the provider setup wizard lists it as unsupported.
#
# The profile authorizes only /usr/local/bin/maki (the path used by
# examples/maki-image) to reach api.x.ai, and binds XAI_API_KEY to that
# endpoint. Do not set XAI_BASE_URL in the sandbox: a different base URL would
# leave the credential unbound.

id: maki-xai
display_name: Maki (xAI)
description: xAI inference API for the Maki coding agent
category: inference
inference_capable: true

credentials:
  - name: api_key
    description: xAI API key
    env_vars: [XAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization

discovery:
  credentials: [api_key]

endpoints:
  - host: api.x.ai
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce

binaries:
  - /usr/local/bin/maki
