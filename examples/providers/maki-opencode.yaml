# Maki + OpenCode Zen provider profile for OpenShell.
#
# Lint and import from the repository root:
#   openshell profile lint -f examples/providers/maki-opencode.yaml
#   openshell profile import -f examples/providers/maki-opencode.yaml --global
#
# Then create the provider instance from your host environment:
#   OPENCODE_API_KEY=<key> openshell provider create \
#     --name maki-opencode --type maki-opencode --from-existing
#
# The profile authorizes only /usr/local/bin/maki (the path used by
# examples/maki-image) to reach opencode.ai, and binds OPENCODE_API_KEY to
# that endpoint. For the Opencode Go endpoint use maki-opencode-go.yaml
# instead. Do not set OPENCODE_BASE_URL in the sandbox: a different base URL
# would leave the credential unbound.

id: maki-opencode
display_name: Maki (OpenCode Zen)
description: OpenCode Zen inference API for the Maki coding agent
category: inference
inference_capable: true

credentials:
  - name: api_key
    description: OpenCode API key
    env_vars: [OPENCODE_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization

discovery:
  credentials: [api_key]

endpoints:
  - host: opencode.ai
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce

binaries:
  - /usr/local/bin/maki
