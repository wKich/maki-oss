# Maki + Z.AI coding-plan provider profile for OpenShell.
#
# Lint and import from the repository root:
#   openshell profile lint -f examples/providers/maki-zai-coding.yaml
#   openshell profile import -f examples/providers/maki-zai-coding.yaml --global
#
# Then create the provider instance from your host environment:
#   ZHIPU_API_KEY=<key> openshell provider create \
#     --name maki-zai-coding --type maki-zai-coding --from-existing
#
# This profile targets the Z.AI coding-plan endpoint. Maki selects it with a
# plan setting in the sandbox's providers.toml, which maki-oss provider setup
# prints but does not write into the sandbox:
#
#   [zai]
#   plan = "coding"
#
# The profile authorizes only /usr/local/bin/maki (the path used by
# examples/maki-image) to reach api.z.ai, and binds ZHIPU_API_KEY to that
# endpoint. Do not set ZAI_BASE_URL in the sandbox: a different base URL would
# leave the credential unbound.

id: maki-zai-coding
display_name: Maki (Z.AI coding plan)
description: Z.AI coding-plan inference API for the Maki coding agent
category: inference
inference_capable: true

credentials:
  - name: api_key
    description: Z.AI (Zhipu) coding-plan API key
    env_vars: [ZHIPU_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization

discovery:
  credentials: [api_key]

endpoints:
  - host: api.z.ai
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce

binaries:
  - /usr/local/bin/maki
