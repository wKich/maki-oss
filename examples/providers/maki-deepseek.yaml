# Maki + DeepSeek provider profile for OpenShell.
#
# Lint and import from the repository root:
#   openshell profile lint -f examples/providers/maki-deepseek.yaml
#   openshell profile import -f examples/providers/maki-deepseek.yaml --global
#
# Then create the provider instance from your host environment:
#   DEEPSEEK_API_KEY=<key> openshell provider create \
#     --name maki-deepseek --type maki-deepseek --from-existing
#
# The profile authorizes only /usr/local/bin/maki (the path used by
# examples/maki-image) to reach api.deepseek.com, and binds DEEPSEEK_API_KEY
# to that endpoint. Do not set DEEPSEEK_BASE_URL in the sandbox: a different
# base URL would leave the credential unbound.

id: maki-deepseek
display_name: Maki (DeepSeek)
description: DeepSeek inference API for the Maki coding agent
category: inference
inference_capable: true

credentials:
  - name: api_key
    description: DeepSeek API key
    env_vars: [DEEPSEEK_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization

discovery:
  credentials: [api_key]

endpoints:
  - host: api.deepseek.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce

binaries:
  - /usr/local/bin/maki
