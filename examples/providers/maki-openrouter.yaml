# Maki + OpenRouter provider profile for OpenShell.
#
# Lint and import from the repository root:
#   openshell profile lint -f examples/providers/maki-openrouter.yaml
#   openshell profile import -f examples/providers/maki-openrouter.yaml --global
#
# Then create the provider instance from your host environment:
#   OPENROUTER_API_KEY=<key> openshell provider create \
#     --name maki-openrouter --type maki-openrouter --from-existing
#
# The profile authorizes only /usr/local/bin/maki (the path used by
# examples/maki-image) to reach openrouter.ai, and binds
# OPENROUTER_API_KEY to that endpoint. Do not set OPENROUTER_BASE_URL in the
# sandbox: a different base URL would leave the credential unbound.

id: maki-openrouter
display_name: Maki (OpenRouter)
description: OpenRouter inference API for the Maki coding agent
category: inference
inference_capable: true

credentials:
  - name: api_key
    description: OpenRouter API key
    env_vars: [OPENROUTER_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization

discovery:
  credentials: [api_key]

endpoints:
  - host: openrouter.ai
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce

binaries:
  - /usr/local/bin/maki
