# Maki + NanoGPT provider profile for OpenShell.
#
# Lint and import from the repository root:
#   openshell profile lint -f examples/providers/maki-nano-gpt.yaml
#   openshell profile import -f examples/providers/maki-nano-gpt.yaml --global
#
# Then create the provider instance from your host environment:
#   NANO_GPT_API_KEY=<key> openshell provider create \
#     --name maki-nano-gpt --type maki-nano-gpt --from-existing
#
# The profile authorizes only /usr/local/bin/maki (the path used by
# examples/maki-image) to reach nano-gpt.com, and binds NANO_GPT_API_KEY to
# that endpoint. Do not set NANO_GPT_BASE_URL in the sandbox: a different base
# URL would leave the credential unbound.

id: maki-nano-gpt
display_name: Maki (NanoGPT)
description: NanoGPT inference router for the Maki coding agent
category: inference
inference_capable: true

credentials:
  - name: api_key
    description: NanoGPT API key
    env_vars: [NANO_GPT_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization

discovery:
  credentials: [api_key]

endpoints:
  - host: nano-gpt.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce

binaries:
  - /usr/local/bin/maki
