# Maki + OpenAI provider profile for OpenShell.
#
# Lint and import from the repository root:
#   openshell profile lint -f examples/providers/maki-openai.yaml
#   openshell profile import -f examples/providers/maki-openai.yaml --global
#
# Then create the provider instance from your host environment:
#   OPENAI_API_KEY=<key> openshell provider create \
#     --name maki-openai --type maki-openai --from-existing
#
# This profile covers the OpenAI platform API key. Maki's ChatGPT OAuth login
# (maki auth login openai) uses different headers and a Codex backend and is
# not covered here; the provider setup wizard lists it as unsupported.
#
# The profile authorizes only /usr/local/bin/maki (the path used by
# examples/maki-image) to reach api.openai.com, and binds OPENAI_API_KEY to
# that endpoint. Do not set OPENAI_BASE_URL in the sandbox: a different base
# URL would leave the credential unbound.

id: maki-openai
display_name: Maki (OpenAI)
description: OpenAI platform inference API for the Maki coding agent
category: inference
inference_capable: true

credentials:
  - name: api_key
    description: OpenAI API key
    env_vars: [OPENAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization

discovery:
  credentials: [api_key]

endpoints:
  - host: api.openai.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce

binaries:
  - /usr/local/bin/maki
