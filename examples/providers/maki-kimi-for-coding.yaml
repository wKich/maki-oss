# Maki + Kimi coding plan provider profile for OpenShell.
#
# Lint and import from the repository root:
#   openshell profile lint -f examples/providers/maki-kimi-for-coding.yaml
#   openshell profile import -f examples/providers/maki-kimi-for-coding.yaml --global
#
# Then create the provider instance from your host environment:
#   KIMI_API_KEY=<key> openshell provider create \
#     --name maki-kimi-for-coding --type maki-kimi-for-coding --from-existing
#
# The profile authorizes only /usr/local/bin/maki (the path used by
# examples/maki-image) to reach api.kimi.ai, and binds KIMI_API_KEY to that
# endpoint. Maki's provider registry calls this endpoint kimi-code-plan-global;
# the CN region (api.kimi.com) is a separate host and needs its own profile.
# Do not set KIMI_BASE_URL in the sandbox: a different base URL would leave the
# credential unbound.

id: maki-kimi-for-coding
display_name: Maki (Kimi For Coding)
description: Kimi coding plan inference API for the Maki coding agent
category: inference
inference_capable: true

credentials:
  - name: api_key
    description: Kimi API key
    env_vars: [KIMI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization

discovery:
  credentials: [api_key]

endpoints:
  - host: api.kimi.ai
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce

binaries:
  - /usr/local/bin/maki
