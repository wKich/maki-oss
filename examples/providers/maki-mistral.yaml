# Maki + Mistral provider profile for OpenShell.
#
# Lint and import from the repository root:
#   openshell profile lint -f examples/providers/maki-mistral.yaml
#   openshell profile import -f examples/providers/maki-mistral.yaml --global
#
# Then create the provider instance from your host environment:
#   MISTRAL_API_KEY=<key> openshell provider create \
#     --name maki-mistral --type maki-mistral --from-existing
#
# The profile authorizes only /usr/local/bin/maki (the path used by
# examples/maki-image) to reach api.mistral.ai, and binds MISTRAL_API_KEY to
# that endpoint. Mistral's standard and Vibe/Coding plans share this host; the
# plan choice lives in the sandbox's providers.toml ([mistral] plan = ...).
# Do not set MISTRAL_BASE_URL in the sandbox: a different base URL would leave
# the credential unbound.

id: maki-mistral
display_name: Maki (Mistral)
description: Mistral inference API for the Maki coding agent
category: inference
inference_capable: true

credentials:
  - name: api_key
    description: Mistral API key
    env_vars: [MISTRAL_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization

discovery:
  credentials: [api_key]

endpoints:
  - host: api.mistral.ai
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce

binaries:
  - /usr/local/bin/maki
