# Maki + Xiaomi token plan (Singapore) provider profile for OpenShell.
#
# Lint and import from the repository root:
#   openshell profile lint -f examples/providers/maki-xiaomi-token-plan-sgp.yaml
#   openshell profile import -f examples/providers/maki-xiaomi-token-plan-sgp.yaml --global
#
# Then create the provider instance from your host environment:
#   XIAOMI_API_KEY=<key> openshell provider create \
#     --name maki-xiaomi-token-plan-sgp --type maki-xiaomi-token-plan-sgp --from-existing
#
# The profile authorizes only /usr/local/bin/maki (the path used by
# examples/maki-image) to reach token-plan-sgp.xiaomimimo.com, and binds
# XIAOMI_API_KEY to that endpoint. The other regions (token-plan-cn,
# token-plan-ams) are separate hosts and need their own profile. Do not set
# XIAOMI_BASE_URL in the sandbox: a different base URL would leave the
# credential unbound.

id: maki-xiaomi-token-plan-sgp
display_name: Maki (Xiaomi Token Plan, Singapore)
description: Xiaomi token plan inference API for the Maki coding agent
category: inference
inference_capable: true

credentials:
  - name: api_key
    description: Xiaomi API key
    env_vars: [XIAOMI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization

discovery:
  credentials: [api_key]

endpoints:
  - host: token-plan-sgp.xiaomimimo.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce

binaries:
  - /usr/local/bin/maki
